# The prop_* modules are fragments of [Properties]: properties.ml includes them
# and properties.mli is the interface for the whole family, so a per-fragment
# .mli would both duplicate that interface and hide the names the include has
# to re-export.
[[rules]]
files = "lib/prop_*.ml"
exclude = ["E505"]

# Declaration.declaration is an existing public API name. Its constructors are
# repeated in the interface to make them private without renaming the type.
[[rules]]
files = "lib/declaration.mli"
exclude = ["E330"]
