name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build and test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        ocaml-compiler: ['5.4', '5.3']
        include:
          - os: macos-latest
            ocaml-compiler: '5.4'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}

      - run: opam install . --deps-only --with-test
      - run: opam exec -- dune build

      # The browser oracles compare cascade against a real engine, so every job
      # has to run the same one. The runner images ship their own Chrome, and it
      # differs between ubuntu and macos: a property one build implements and
      # the other does not makes the comparison fail on whichever runner is
      # behind, whatever the diff under test says. [CHROME] is the override
      # test/render/browser.ml reads before it goes looking.
      - name: Install the pinned browser
        run: |
          PLAYWRIGHT_BROWSERS_PATH="$HOME/.cache/cascade-browser" \
            npx --yes playwright@1.63.0 install chromium-headless-shell
      - name: Point the browser oracles at it
        shell: bash
        run: |
          shell=$(find "$HOME/.cache/cascade-browser" -name chrome-headless-shell -type f | head -1)
          test -x "$shell"
          echo "CHROME=$shell" >> "$GITHUB_ENV"
      - run: opam exec -- dune test

  lower-bounds:
    name: Lower bounds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.2'

      # Resolve every dependency to the oldest version its lower bound allows,
      # so a call that only compiles against a newer API (a deprecated function
      # removed upstream) fails here rather than in a downstream opam build.
      - run: opam install . --deps-only --with-test --criteria="+count[version-lag,solution]"
      - run: opam exec -- dune build

      # The browser oracles compare cascade against a real engine, so every job
      # has to run the same one. The runner images ship their own Chrome, and it
      # differs between ubuntu and macos: a property one build implements and
      # the other does not makes the comparison fail on whichever runner is
      # behind, whatever the diff under test says. [CHROME] is the override
      # test/render/browser.ml reads before it goes looking.
      - name: Install the pinned browser
        run: |
          PLAYWRIGHT_BROWSERS_PATH="$HOME/.cache/cascade-browser" \
            npx --yes playwright@1.63.0 install chromium-headless-shell
      - name: Point the browser oracles at it
        shell: bash
        run: |
          shell=$(find "$HOME/.cache/cascade-browser" -name chrome-headless-shell -type f | head -1)
          test -x "$shell"
          echo "CHROME=$shell" >> "$GITHUB_ENV"
      - run: opam exec -- dune test

  ascii:
    name: ASCII source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The same script the pre-commit hook runs, on the tracked files rather
      # than the index. Kept out of the lint job so the rule reports in seconds
      # instead of waiting on an opam switch it does not need. [shell: bash]
      # turns on pipefail, so a failing [git ls-files] cannot read as clean.
      - shell: bash
        run: git ls-files | scripts/check_ascii.sh

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.4'

      - uses: ocaml/setup-ocaml/lint-fmt@v3
      - run: opam repo add samoht https://tangled.org/gazagnaire.org/opam-overlay.git
      - run: opam install . --deps-only --with-test
      - run: opam install merlint
      - run: opam exec -- merlint --build
